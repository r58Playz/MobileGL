<!doctype html>
<html>
<head><meta charset="utf-8"><title>MobileGL apitrace replayer</title></head>
<body style="margin:0;background:#111">
  <!-- The WebGPU device owns #canvas, so it can't also be drawn to with a 2D context
       (and the replayer never Presents). The captured frame is painted to #result. -->
  <canvas id="canvas" width="854" height="480" style="display:none"></canvas>
  <canvas id="result" width="854" height="480" style="display:block;margin:8px auto;background:#000"></canvas>
  <pre id="log" style="color:#0f0;font:12px monospace;padding:8px;white-space:pre-wrap"></pre>
  <script>
    // Resize the canvas before the module starts when ?w=/?h= override the surface
    // size (the WebGPU surface is configured from the canvas element size).
    (function() {
      var q = new URLSearchParams(location.search);
      var w = parseInt(q.get('w') || '0', 10), h = parseInt(q.get('h') || '0', 10);
      if (w > 0 && h > 0) {
        var c = document.getElementById('canvas');
        c.width = w; c.height = h;
      }
    })();
    var Module = {
      canvas: document.getElementById('canvas'),
      // ?target=N replays only to call N (bisecting hangs/mismatches);
      // ?dumpprog=N dumps trace program N's GLSL on first glUseProgram.
      targetCall: parseInt(new URLSearchParams(location.search).get('target') || '0', 10) || 0,
      dumpProg: parseInt(new URLSearchParams(location.search).get('dumpprog') || '0', 10) || 0,
      // ?showtex=N reads back trace texture N (an intermediate colortex) instead of the FB.
      showTex: parseInt(new URLSearchParams(location.search).get('showtex') || '0', 10) || 0,
      // ?vdbgfrom=N opens the backend verbose-draw log from call N to the end of the trace.
      vdbgFrom: parseInt(new URLSearchParams(location.search).get('vdbgfrom') || '0', 10) || 0,
      // ?nomap=1 skips replaying mapped-buffer memcpy writes (corruption bisection).
      noMap: new URLSearchParams(location.search).get('nomap') === '1',
      // ?nogolden=1 skips the golden compare (partial replays don't match the final
      // image); ?capw=/?caph= override the capture size (small mid-frame FBOs).
      noGolden: new URLSearchParams(location.search).get('nogolden') === '1',
      // ?dumpwgsl=N dumps the final WGSL of replay program N (GL name).
      dumpWgsl: parseInt(new URLSearchParams(location.search).get('dumpwgsl') || '0', 10) || 0,
      // ?w=/?h= override the surface size (fixtures not captured at 854x480).
      surfW: parseInt(new URLSearchParams(location.search).get('w') || '0', 10) || 0,
      surfH: parseInt(new URLSearchParams(location.search).get('h') || '0', 10) || 0,
      capW: parseInt(new URLSearchParams(location.search).get('capw') || '0', 10) || 0,
      capH: parseInt(new URLSearchParams(location.search).get('caph') || '0', 10) || 0,
      print: (t)    => { document.getElementById('log').textContent += t + "\n"; console.log(t); },
      printErr: (t) => { document.getElementById('log').textContent += "ERR: " + t + "\n"; console.error(t); },
      preRun: [function() {
        if (!navigator.gpu) { Module.printErr("WebGPU not available"); return; }
        addRunDependency('webgpu-device');
        (async () => {
          try {
            const adapter = await navigator.gpu.requestAdapter();
            // Optional features Iris float render targets rely on: rg11b10ufloat as a
            // renderable target, and linear filtering of 32-bit float textures. Request
            // only those the adapter actually advertises.
            const wanted = ['rg11b10ufloat-renderable', 'float32-filterable'];
            const requiredFeatures = wanted.filter((f) => adapter.features.has(f));
            const device = await adapter.requestDevice({ requiredFeatures, requiredLimits: {
              maxBufferSize: adapter.limits.maxBufferSize,
              maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
            }});
            Module.preinitializedWebGPUDevice = device;
            Module.print("[shell] WebGPU device acquired");
          } catch (e) { Module.printErr("device acquisition failed: " + e); }
          finally { removeRunDependency('webgpu-device'); }
        })();
      }],
      // Called after the replay's promising run resolves: compare to the golden PNG.
      onReplayDone: function() {
        if (!Module._replay_done || !Module._replay_done()) { Module.printErr("replay did not capture"); return; }
        const w = Module._replay_width(), h = Module._replay_height();
        const ptr = Module._replay_pixels();
        const px = Module.HEAPU8.subarray(ptr, ptr + w * h * 4); // RGBA, GL bottom-up
        // Always paint the capture (top-down flip) into #result so it can be pulled
        // out via toDataURL; skip the golden compare when ?nogolden=1.
        const rc = document.getElementById('result');
        rc.width = w; rc.height = h;
        const out = rc.getContext('2d');
        const id = out.createImageData(w, h);
        for (let y = 0; y < h; y++) for (let x = 0; x < w*4; x++) id.data[y*w*4+x] = px[(h-1-y)*w*4+x];
        for (let i = 3; i < id.data.length; i += 4) id.data[i] = 255; // force opaque
        out.putImageData(id, 0, 0);
        Module.print("[capture] painted " + w + "x" + h);
        if (Module.noGolden) { Module.print("[compare] skipped (nogolden)"); return; }
        const img = new Image();
        img.onload = function() {
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h);
          const golden = g.getImageData(0, 0, w, h).data; // RGBA, top-down
          const FUZZ = 51, TOL = 20; // 20% per-channel, 20 mismatched pixels (fixture config)
          let mismatch = 0;
          for (let y = 0; y < h; y++) {
            const gy = y, ry = h - 1 - y; // flip: GL readback is bottom-up
            for (let x = 0; x < w; x++) {
              const gi = (gy * w + x) * 4, ri = (ry * w + x) * 4;
              if (Math.abs(px[ri] - golden[gi]) > FUZZ ||
                  Math.abs(px[ri+1] - golden[gi+1]) > FUZZ ||
                  Math.abs(px[ri+2] - golden[gi+2]) > FUZZ) mismatch++;
            }
          }
          Module.print("[compare] mismatch=" + mismatch + " / " + (w*h) +
                       " (tolerance " + TOL + ") -> " + (mismatch <= TOL ? "PASS" : "FAIL"));
        };
        img.onerror = function() { Module.printErr("[compare] failed to load golden.png"); };
        img.src = "golden.png?ts=" + Date.now(); // cache-bust: golden changes per fixture
      },
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
